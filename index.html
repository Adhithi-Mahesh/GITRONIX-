```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub Meme</title>

<style>
body {
    margin: 0;
    padding: 25px 12px;
    background: #baffed;
    font-family: Arial, sans-serif;
    text-align: center;
    color: #064e43;
}

.meme {
    max-width: 650px;
    margin: 30px auto;
    padding: 25px;
    background: white;
    border: 4px solid #087f70;
    border-radius: 25px;
    box-shadow: 0 8px 20px #064e4325;
}

h1 {
    font-size: 38px;
    color: #087f70;
}

.caption {
    font-size: 25px;
    font-weight: bold;
    line-height: 1.5;
}

.emoji {
    font-size: 95px;
    margin: 20px;
}

.terminal {
    background: #123b35;
    color: #aaffd9;
    padding: 18px;
    border-radius: 12px;
    font-family: monospace;
    font-size: 20px;
    overflow-wrap: anywhere;
}

footer {
    margin-top: 25px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="meme">

    <h1>GIT COMMIT? 💀</h1>

    <p class="caption">
        ME: "I FINISHED MY CODE!"
    </p>

    <div class="emoji">😌💻</div>

    <div class="terminal">
        $ git status<br><br>
        Changes not staged for commit 😭
    </div>

    <div class="emoji">🤡</div>

    <p class="caption">
        3 HOURS OF CODING...<br>
        ZERO COMMITS.
    </p>

    <footer>
        #GitHubWorkshop #DeveloperLife 💚
    </footer>

</div>

</body>
</html>
```
